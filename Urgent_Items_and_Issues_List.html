<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Urgent Items and Issues List</title>
  <style>
    :root{--orange:#f36a00;--orange2:#ff9a4d;--bg:#080d10;--panel:rgba(9,14,16,.82);--line:rgba(255,255,255,.14);--text:#fff;--muted:rgba(255,255,255,.72);--red:#e14e4e;--green:#2e9d67;--shadow:0 18px 50px rgba(0,0,0,.42)}
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:var(--bg);background-image:linear-gradient(115deg,rgba(6,10,12,.96),rgba(9,14,16,.82) 42%,rgba(9,14,16,.94)),radial-gradient(circle at 72% 18%,rgba(243,106,0,.1),transparent 32%),repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.018) 80px),repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.014) 80px);background-attachment:fixed}button{font:inherit}header{position:sticky;top:0;z-index:20;border-bottom:3px solid var(--orange);background:rgba(4,8,10,.82);backdrop-filter:blur(10px)}.header-inner,main{width:min(1500px,calc(100% - 32px));margin:auto}.header-inner{min-height:98px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0}.brand{display:flex;align-items:center;gap:18px}.logo{width:154px;padding:9px 11px;border-radius:8px;background:#fff;color:#111;font-size:21px;font-weight:900;line-height:.9;text-align:center}.logo small{display:block;margin-top:7px;color:var(--orange);font-size:10px;letter-spacing:.15em}h1{margin:0 0 4px;font-size:clamp(25px,4vw,38px)}.subtitle{margin:0;color:var(--orange2)}button{min-height:42px;padding:10px 16px;border:1px solid var(--orange);border-radius:10px;color:#fff;background:var(--orange);font-weight:800;cursor:pointer}button:hover{background:#ff7a14}button.secondary{background:rgba(255,255,255,.08);border-color:var(--line)}button.secondary:hover{border-color:var(--orange);color:var(--orange2)}.toolbar,.filters{display:flex;gap:10px;flex-wrap:wrap}.toolbar{justify-content:flex-end}main{padding:24px 0 50px}.screen{display:none}.screen.active{display:block}.card{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(8px);margin-bottom:22px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.topline h2{margin:0}.count{color:var(--muted)}.list-item{border:1px solid var(--line);border-radius:12px;background:rgba(3,7,9,.58);margin-bottom:14px;overflow:hidden;page-break-inside:avoid}.columns{display:grid;grid-template-columns:120px 1.1fr 1fr 1.4fr 1fr}.cell{padding:12px;border-right:1px solid var(--line)}.cell:last-child{border-right:0}.cell b{display:block;margin-bottom:6px;color:var(--orange2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.description{padding:14px 16px;border-top:1px solid var(--line);line-height:1.5;white-space:pre-wrap}.description b{color:var(--orange2);margin-right:8px}.resolved{width:21px;height:21px;accent-color:var(--orange)}.type{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.type.urgent{color:#ffc0c0;border:1px solid rgba(225,78,78,.5);background:rgba(225,78,78,.15)}.type.issue{color:#ffd0ad;border:1px solid rgba(243,106,0,.5);background:rgba(243,106,0,.15)}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:10px;background:var(--orange);box-shadow:var(--shadow);font-weight:800;transform:translateY(100px);opacity:0;transition:.25s}.toast.show{transform:translateY(0);opacity:1}
    @media(max-width:900px){.columns{grid-template-columns:1fr 1fr}.cell{border-bottom:1px solid var(--line)}}@media(max-width:650px){header{position:static}.header-inner,.brand,.topline{align-items:stretch;flex-direction:column}.toolbar button,.filters button{flex:1}.columns{grid-template-columns:1fr}.cell{border-right:0}.card{padding:16px}}@media print{body{background:#fff;color:#000}header,.no-print,.toast{display:none!important}main{width:100%;padding:0}.screen{display:none!important}.screen.active{display:block!important}.card{border:0;box-shadow:none;background:#fff;padding:0}.list-item{background:#fff;color:#000;border-color:#777}.cell,.description{border-color:#999}.cell b,.description b{color:#000}.type{color:#000!important;background:#eee!important;border-color:#777!important}}
  </style>
</head>
<body>
<header><div class="header-inner"><div class="brand"><div class="logo">WESCO<small>EXTERIORS, INC.</small></div><div><h1>Urgent Items and Issues List</h1><p class="subtitle">Wesco Exteriors, Inc. Consolidated List</p></div></div><div class="toolbar no-print"><button class="secondary" id="saveBtn" type="button">Save</button><button class="secondary" id="printBtn" type="button">Print</button></div></div></header>
<main>
  <section class="screen active" id="allScreen"><div class="card"><div class="topline"><div><h2>All Urgent Items and Issues</h2><div class="count" id="allCount"></div></div><div class="filters no-print"><button type="button" data-screen="urgentScreen">Show All Urgent Items</button><button type="button" data-screen="issueScreen">Show All Issue Items</button></div></div><div id="allList"></div></div></section>
  <section class="screen" id="urgentScreen"><div class="card"><div class="topline"><div><h2>All Urgent Items</h2><div class="count" id="urgentCount"></div></div><div class="filters no-print"><button class="secondary" type="button" data-screen="allScreen">Back to Full List</button><button class="secondary" type="button" data-print>Print</button><button class="secondary" type="button" data-save>Save</button></div></div><div id="urgentList"></div></div></section>
  <section class="screen" id="issueScreen"><div class="card"><div class="topline"><div><h2>All Issue Items</h2><div class="count" id="issueCount"></div></div><div class="filters no-print"><button class="secondary" type="button" data-screen="allScreen">Back to Full List</button><button class="secondary" type="button" data-print>Print</button><button class="secondary" type="button" data-save>Save</button></div></div><div id="issueList"></div></div></section>
</main><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='wesco_issues_v2',$=id=>document.getElementById(id);let items=[];function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[]}catch(e){items=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(items))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return'';const d=v.slice(0,10).split('-');return d.length===3?`${d[1]}/${d[2]}/${d[0]}`:v}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function card(x){const people=Array.isArray(x.issuedFor)?x.issuedFor.join(', '):(x.issuedFor||'');return `<article class="list-item"><div class="columns"><div class="cell"><b>Resolved Box</b><input class="resolved" type="checkbox" data-id="${esc(x.id)}" ${x.resolved?'checked':''}></div><div class="cell"><b>Issued By</b>${esc(x.issuer)}</div><div class="cell"><b>Due Date</b>${esc(fmt(x.dueDate))}</div><div class="cell"><b>Issued For</b>${esc(people)}</div><div class="cell"><b>Urgent / Issue</b><span class="type ${(x.type||'Issue').toLowerCase()}">${esc(x.type||'Issue')}</span></div></div><div class="description"><b>Description:</b>${esc(x.description)}</div></article>`}function fill(root,count,data){$(count).textContent=`${data.length} item${data.length===1?'':'s'}`;$(root).innerHTML=data.length?data.map(card).join(''):'<div class="empty">No items to show.</div>'}function render(){const sorted=[...items].sort((a,b)=>(a.resolved-b.resolved)||((a.dueDate||'').localeCompare(b.dueDate||'')));fill('allList','allCount',sorted);fill('urgentList','urgentCount',sorted.filter(x=>x.type==='Urgent'));fill('issueList','issueCount',sorted.filter(x=>x.type==='Issue'))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));scrollTo({top:0,behavior:'smooth'})}document.addEventListener('click',e=>{if(e.target.dataset.screen)show(e.target.dataset.screen);if(e.target.hasAttribute('data-print'))window.print();if(e.target.hasAttribute('data-save')){save();toast('List saved.')}});document.addEventListener('change',e=>{if(!e.target.matches('.resolved'))return;const x=items.find(v=>v.id===e.target.dataset.id);if(x){x.resolved=e.target.checked;x.resolvedAt=x.resolved?new Date().toISOString():null;save();render();toast(x.resolved?'Item marked resolved.':'Item reopened.')}});$('saveBtn').addEventListener('click',()=>{save();toast('List saved.')});$('printBtn').addEventListener('click',()=>window.print());window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});load();render()})();
</script>
</body></html>
