<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wesco Urgent Items / Issues</title>
  <style>
    :root{--orange:#f36a00;--orange2:#ff9a4d;--bg:#080d10;--panel:rgba(9,14,16,.82);--line:rgba(255,255,255,.14);--text:#fff;--muted:rgba(255,255,255,.72);--red:#e14e4e;--green:#2e9d67;--shadow:0 18px 50px rgba(0,0,0,.42)}
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:var(--bg);background-image:linear-gradient(115deg,rgba(6,10,12,.96),rgba(9,14,16,.82) 42%,rgba(9,14,16,.94)),radial-gradient(circle at 72% 18%,rgba(243,106,0,.1),transparent 32%),repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.018) 80px),repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.014) 80px);background-attachment:fixed}
    button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:20;border-bottom:3px solid var(--orange);background:rgba(4,8,10,.82);backdrop-filter:blur(10px)}.header-inner,main{width:min(1450px,calc(100% - 32px));margin:auto}.header-inner{min-height:98px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0}.brand{display:flex;align-items:center;gap:18px}.logo{width:154px;padding:9px 11px;border-radius:8px;background:#fff;color:#111;font-size:21px;font-weight:900;line-height:.9;text-align:center}.logo small{display:block;margin-top:7px;color:var(--orange);font-size:10px;letter-spacing:.15em}.brand h1{margin:0 0 4px;font-size:clamp(25px,4vw,38px)}.subtitle{margin:0;color:var(--orange2)}main{padding:24px 0 50px}.card{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(8px);margin-bottom:22px}.section-top{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}.section-top h2{margin:0 0 5px}.section-top p{margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}label{display:block;margin-bottom:7px;color:var(--muted);font-size:13px;font-weight:800}input,select,textarea{position:relative;z-index:1;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;color:#fff;background:rgba(3,7,9,.72);pointer-events:auto}textarea{resize:vertical;min-height:100px}input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(243,106,0,.16)}button{min-height:42px;padding:10px 16px;border:1px solid var(--orange);border-radius:10px;color:#fff;background:var(--orange);font-weight:800;cursor:pointer}button:hover{background:#ff7a14}.secondary{background:rgba(255,255,255,.08);border-color:var(--line)}.secondary:hover{border-color:var(--orange);color:var(--orange2)}.danger{background:rgba(216,74,74,.18);border-color:rgba(216,74,74,.45);color:#ffb4b4}.actions,.toolbar{display:flex;gap:10px;flex-wrap:wrap}.multi{position:relative}.multi-trigger{text-align:left;width:100%;background:rgba(3,7,9,.72);border-color:var(--line);font-weight:400}.multi-menu{display:none;position:static;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#10171a;box-shadow:var(--shadow)}.multi.open .multi-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.multi-menu label{display:flex;align-items:center;gap:9px;padding:7px;margin:0;color:#fff;cursor:pointer}.multi-menu input{position:static;width:18px;height:18px;accent-color:var(--orange)}#otherNameWrap{grid-column:1/-1;margin-top:8px}.type-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type-choice label{display:flex;align-items:center;justify-content:center;gap:9px;min-height:44px;margin:0;border:1px solid var(--line);border-radius:10px;color:#fff;background:rgba(3,7,9,.72);cursor:pointer}.type-choice input{position:static;width:18px;height:18px;accent-color:var(--orange)}.type-choice label:has(input:checked){border-color:var(--orange);background:rgba(243,106,0,.15)}
    .list-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.list-head h2{margin:0}.item{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:16px;border:1px solid var(--line);border-radius:12px;background:rgba(3,7,9,.58);margin-bottom:11px}.resolved-box{display:flex;align-items:center;gap:7px;color:#fff}.resolved-box input{width:21px;height:21px;accent-color:var(--orange)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:800}.badge.urgent{color:#ffc0c0;border-color:rgba(225,78,78,.5);background:rgba(225,78,78,.15)}.badge.issue{color:#ffd0ad;border-color:rgba(243,106,0,.5);background:rgba(243,106,0,.15)}.description{line-height:1.45;white-space:pre-wrap}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.audit-record{display:block;width:100%;margin-bottom:10px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;background:rgba(3,7,9,.58)}.audit-summary{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:15px;cursor:pointer}.audit-summary:hover{background:rgba(243,106,0,.08)}.audit-details{display:none;padding:0 15px 15px;border-top:1px solid var(--line)}.audit-record.open .audit-details{display:block}.audit-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.toast{position:fixed;right:18px;bottom:18px;z-index:40;padding:13px 16px;border-radius:10px;background:var(--orange);box-shadow:var(--shadow);font-weight:800;transform:translateY(100px);opacity:0;transition:.25s}.toast.show{transform:translateY(0);opacity:1}
    @media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){header{position:static}.header-inner,.section-top,.list-head{align-items:stretch;flex-direction:column}.brand{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.card{padding:16px}.toolbar button,.actions button{flex:1}}@media print{body{background:#fff;color:#000}header,.form-card,.no-print,.item-actions,.toast{display:none!important}main{width:100%;padding:0}.card{border:0;box-shadow:none;background:#fff;padding:0}.item{display:block;border:0;border-bottom:1px solid #777;border-radius:0;background:#fff;color:#000;page-break-inside:avoid}.badge{color:#000!important;background:#eee!important;border-color:#777!important}.resolved-box{color:#000}.list-card h2:after{content:" — Printed List"}}
  </style>
</head>
<body>
<header><div class="header-inner"><div class="brand"><div class="logo">WESCO<small>EXTERIORS, INC.</small></div><div><h1>Urgent Items / Issues</h1><p class="subtitle">Wesco Exteriors, Inc. Action Tracker</p></div></div><div class="toolbar"><button class="secondary" type="button" id="auditBtn">Resolved Audit Log</button><button class="secondary" type="button" id="saveBtn">Save</button><button class="secondary" type="button" id="printTopBtn">Print</button></div></div></header>
<main>
  <section class="card form-card">
    <div class="section-top"><div><h2>Add an Item</h2><p>Complete the required fields and add the item to the open list.</p></div></div>
    <form id="itemForm">
      <div class="grid">
        <div class="field"><label for="issuer">Issued By</label><select id="issuer" required><option value="">Select…</option><option>Wes</option><option>Stephanie</option><option>Rebecca</option><option>Oscar</option><option>Joe</option><option>Chris</option><option>Theo</option><option>Jesse</option></select></div>
        <div class="field"><label for="dateIssued">Date Issued</label><input id="dateIssued" type="date" required></div>
        <div class="field"><label for="dueDate">Due Date</label><input id="dueDate" type="date" required></div>
        <div class="field">
          <label>Issued For (select one or more)</label>
          <div class="multi" id="issuedForMulti"><button class="multi-trigger" id="issuedForTrigger" type="button">Select names…</button><div class="multi-menu" id="issuedForMenu">
            <label><input type="checkbox" value="Wes">Wes</label><label><input type="checkbox" value="Stephanie">Stephanie</label><label><input type="checkbox" value="Rebecca">Rebecca</label><label><input type="checkbox" value="Oscar">Oscar</label><label><input type="checkbox" value="Joe">Joe</label><label><input type="checkbox" value="Chris">Chris</label><label><input type="checkbox" value="Theo">Theo</label><label><input type="checkbox" value="Jesse">Jesse</label><label><input type="checkbox" value="Other">Other</label>
            <div id="otherNameWrap" hidden><input id="otherName" type="text" placeholder="Type other person's name"></div>
          </div></div>
        </div>
        <div class="field"><label>Urgent / Issue</label><div class="type-choice"><label for="typeUrgent"><input id="typeUrgent" type="radio" name="itemType" value="Urgent" required>Urgent</label><label for="typeIssue"><input id="typeIssue" type="radio" name="itemType" value="Issue" required>Issue</label></div></div>
        <div class="field full"><label for="description">Description</label><textarea id="description" maxlength="1500" placeholder="Describe the urgent item or issue…" required></textarea></div>
      </div>
      <div class="actions"><button type="reset" class="secondary">Clear</button><button type="submit">Add to List</button></div>
    </form>
  </section>
  <section class="card list-card">
    <div class="list-head"><h2 id="openHeading">Open Items (0)</h2><button class="secondary no-print" type="button" id="printListBtn">Print List</button></div>
    <div id="openList"></div>
  </section>
  <section class="card list-card" id="auditLog">
    <div class="list-head"><div><h2 id="auditHeading">Resolved Audit Log (0)</h2><p class="subtitle">Click a resolved record to review its full details.</p></div><button class="secondary no-print" type="button" id="printAuditBtn">Print Audit Log</button></div>
    <div id="auditList"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const API='/api/urgent-items', $=id=>document.getElementById(id);
let items=[];
async function api(path='',options={}){const response=await fetch(API+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(response.status===401){location.href='/.auth/login/aad?post_login_redirect_uri='+encodeURIComponent(location.pathname);throw new Error('Sign in required.')}if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.error||'The shared list could not be updated.')}return response.status===204?null:response.json()}
async function load(){const data=await api();items=Array.isArray(data.items)?data.items:[]}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){if(!v)return'';const [y,m,d]=v.split('-');return `${m}/${d}/${y}`}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
function selectedFor(){const vals=[...$('issuedForMenu').querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);return vals.map(v=>v==='Other'?$('otherName').value.trim():v).filter(Boolean)}
function updateFor(){const vals=selectedFor();$('issuedForTrigger').textContent=vals.length?vals.join(', '):'Select names…';const other=[...$('issuedForMenu').querySelectorAll('input')].find(x=>x.value==='Other');$('otherNameWrap').hidden=!other.checked}
function resetForm(){ $('itemForm').reset(); $('dateIssued').value=new Date().toISOString().slice(0,10); $('otherNameWrap').hidden=true; updateFor() }
function render(){const open=items.filter(x=>!x.resolved).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')),resolved=items.filter(x=>x.resolved).sort((a,b)=>(b.resolvedAt||'').localeCompare(a.resolvedAt||''));$('openHeading').textContent=`Open Items (${open.length})`;$('openList').innerHTML=open.length?open.map(x=>`<article class="item"><label class="resolved-box"><input type="checkbox" data-resolve="${esc(x.id)}">Resolved</label><div><div class="meta"><span class="badge ${x.type.toLowerCase()}">${esc(x.type)}</span><span class="badge">Issued by: ${esc(x.issuer)}</span><span class="badge">Issued: ${esc(fmt(x.dateIssued))}</span><span class="badge">Due: ${esc(fmt(x.dueDate))}</span><span class="badge">For: ${esc(x.issuedFor.join(', '))}</span></div><div class="description">${esc(x.description)}</div></div><div class="item-actions no-print"><button class="danger" type="button" data-delete="${esc(x.id)}">Delete</button></div></article>`).join(''):'<div class="empty">No open urgent items or issues.</div>';$('auditHeading').textContent=`Resolved Audit Log (${resolved.length})`;$('auditList').innerHTML=resolved.length?resolved.map(x=>`<article class="audit-record" data-record="${esc(x.id)}"><div class="audit-summary" data-toggle="${esc(x.id)}"><div class="meta"><span class="badge ${x.type.toLowerCase()}">${esc(x.type)}</span><span class="badge">Issued by: ${esc(x.issuer)}</span><span class="badge">For: ${esc(x.issuedFor.join(', '))}</span><span class="badge">Resolved: ${esc(x.resolvedAt?new Date(x.resolvedAt).toLocaleString():'')}</span></div><strong>Review Details</strong></div><div class="audit-details"><div class="meta"><span class="badge">Date Issued: ${esc(fmt(x.dateIssued))}</span><span class="badge">Due Date: ${esc(fmt(x.dueDate))}</span></div><div class="description"><strong>Description:</strong><br>${esc(x.description)}</div><div class="audit-actions no-print"><button class="secondary" type="button" data-reopen="${esc(x.id)}">Reopen Item</button><button class="secondary" type="button" data-print-record="${esc(x.id)}">Print Record</button></div></div></article>`).join(''):'<div class="empty">No resolved items are in the audit log.</div>'}
$('issuedForTrigger').addEventListener('click',()=> $('issuedForMulti').classList.toggle('open'));
$('issuedForMenu').addEventListener('change',updateFor);$('otherName').addEventListener('input',updateFor);
$('dueDate').addEventListener('click',function(){if(typeof this.showPicker==='function')this.showPicker()});
document.addEventListener('click',e=>{if(!$('issuedForMulti').contains(e.target))$('issuedForMulti').classList.remove('open')});
$('itemForm').addEventListener('reset',()=>setTimeout(resetForm));
$('itemForm').addEventListener('submit',async e=>{e.preventDefault();const issuedFor=selectedFor();const type=document.querySelector('input[name=itemType]:checked');const otherChecked=[...$('issuedForMenu').querySelectorAll('input')].some(x=>x.value==='Other'&&x.checked);if(!issuedFor.length){toast(otherChecked?'Type the Other person’s name.':'Select at least one Issued For name.');return}if(!type){toast('Select Urgent or Issue.');return}const submit=e.submitter;submit.disabled=true;try{const data=await api('',{method:'POST',body:JSON.stringify({issuer:$('issuer').value,dateIssued:$('dateIssued').value,dueDate:$('dueDate').value,issuedFor,type:type.value,description:$('description').value.trim()})});items.unshift(data.item);resetForm();render();toast('Item added to the shared list.')}catch(error){toast(error.message)}finally{submit.disabled=false}});
$('openList').addEventListener('change',async e=>{const id=e.target.dataset.resolve;if(!id)return;const x=items.find(v=>v.id===id);if(!x)return;e.target.disabled=true;try{await api('/'+id,{method:'PATCH',body:JSON.stringify({resolved:true,createdAt:x.createdAt})});x.resolved=true;x.resolvedAt=new Date().toISOString();render();toast('Item marked resolved.')}catch(error){e.target.checked=false;e.target.disabled=false;toast(error.message)}});
$('openList').addEventListener('click',async e=>{const id=e.target.dataset.delete;if(!id)return;if(confirm('Delete this item?')){try{await api('/'+id,{method:'DELETE'});items=items.filter(v=>v.id!==id);render();toast('Item deleted.')}catch(error){toast(error.message)}}});
$('auditList').addEventListener('click',async e=>{const toggle=e.target.closest('[data-toggle]');if(toggle){toggle.closest('.audit-record').classList.toggle('open');return}const reopen=e.target.closest('[data-reopen]');if(reopen){const x=items.find(v=>v.id===reopen.dataset.reopen);if(x){try{await api('/'+x.id,{method:'PATCH',body:JSON.stringify({resolved:false,createdAt:x.createdAt})});x.resolved=false;x.resolvedAt=null;render();toast('Item reopened.')}catch(error){toast(error.message)}}return}if(e.target.closest('[data-print-record]'))window.print()});
$('auditBtn').addEventListener('click',()=>$('auditLog').scrollIntoView({behavior:'smooth',block:'start'}));
$('saveBtn').addEventListener('click',async()=>{try{await load();render();toast('Shared list refreshed.')}catch(error){toast(error.message)}});$('printTopBtn').addEventListener('click',()=>window.print());$('printListBtn').addEventListener('click',()=>window.print());$('printAuditBtn').addEventListener('click',()=>window.print());
resetForm();load().then(render).catch(error=>toast(error.message));
})();
</script>
</body>
</html>
