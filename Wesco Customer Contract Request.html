<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wesco Customer Contract Request</title>
  <style>
:root{
  --orange:#FF7012;
  --white:#FFFFFF;
  --muted:rgba(255,255,255,.62);
  --muted-soft:rgba(255,255,255,.42);
  --line:#FF7012;
  --focus-ring:rgba(255,112,18,.55);
  --success:#8BE28B;
  --font:'Segoe UI','Open Sans',system-ui,-apple-system,Arial,sans-serif;
  font-family:var(--font);
  color:var(--white);
  background:#090e10;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#090e10;
  color:var(--white);
  font-family:var(--font);
  font-size:14.5px;
  line-height:1.45;
}
.widget{
  min-height:100vh;
  min-height:100dvh;
  padding:24px;
  background:rgba(9,14,16,.74);
}
.back-row{max-width:860px;margin:0 auto 12px}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--orange);
  text-decoration:none;
  font-size:12.5px;
  font-weight:800;
  border:1px solid var(--orange);
  border-radius:4px;
  padding:8px 13px;
  background:transparent;
  transition:background .12s ease,color .12s ease;
}
.back-link:hover,.back-link:focus-visible{
  background:var(--orange);
  color:#1a1a1a;
  outline:none;
}
main{
  width:100%;
  max-width:860px;
  margin:0 auto;
  padding:0;
  background:rgba(9,14,16,.74);
  border:1px solid rgba(255,255,255,.14);
  border-radius:5px;
  overflow:hidden;
  box-shadow:0 16px 42px rgba(0,0,0,.28);
}
header{
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 22px;
  border-bottom:2px solid var(--line);
}
.logo{height:42px;width:auto;display:block;flex-shrink:0}
.title{flex:1;min-width:0;text-align:left}
h1{
  margin:0;
  color:var(--white);
  font-size:20px;
  line-height:1.25;
  font-weight:800;
  letter-spacing:.01em;
}
.subtitle{margin:3px 0 0;color:var(--muted);font-size:12px;font-weight:400}
.notice{
  margin:0 22px;
  padding:17px 0 10px;
  color:var(--muted);
  background:transparent;
  border:0;
  font-size:12.5px;
  font-weight:600;
  line-height:1.45;
}
form{padding:0 22px 22px}
fieldset{margin:0;padding:0;border:0}
fieldset+fieldset{
  margin-top:7px!important;
  padding-top:0;
  border-top:1px solid var(--line);
}
legend{
  width:100%;
  margin:0;
  padding:19px 0 9px;
  color:var(--orange);
  font-size:11.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
label{
  display:block;
  margin-bottom:5px;
  color:var(--white);
  font-size:12.5px;
  font-weight:700;
}
.required{color:var(--orange);font-weight:800}
input,textarea{
  width:100%;
  min-height:42px;
  padding:10px 11px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:4px;
  background:rgba(255,255,255,.05);
  color:var(--white);
  font:inherit;
  font-size:13.5px;
}
input::placeholder,textarea::placeholder{color:var(--muted-soft)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{
  outline:none;
  border-color:var(--orange);
  box-shadow:0 0 0 3px var(--focus-ring);
  background:rgba(255,112,18,.06);
}
.preview-wrap{
  margin-top:19px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.preview-wrap h2{
  margin:0 0 9px;
  color:var(--orange);
  font-size:11.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}
#emailPreview{
  padding:14px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.18);
  border-left:3px solid var(--orange);
  border-radius:4px;
  color:var(--white);
  line-height:1.55;
  white-space:pre-wrap;
}
.actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:14px;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
button{
  min-height:46px;
  padding:0 24px;
  border:1px solid var(--orange);
  border-radius:4px;
  background:var(--orange);
  color:#1a1a1a;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
button:hover,button:focus-visible{filter:brightness(1.08);outline:none}
button:active{transform:translateY(1px)}
#status{min-height:22px;color:var(--success);font-weight:700}
@media(max-width:620px){
  .widget{padding:12px}
  header{padding:14px 16px;align-items:flex-start}
  .logo{height:34px}
  .notice{margin:0 16px}
  form{padding:0 16px 18px}
  .form-grid{grid-template-columns:1fr}
  .field.wide{grid-column:auto}
  .actions{align-items:stretch;flex-direction:column}
  button{width:100%}
}
@media print{
  html,body,.widget{background:#fff;color:#000}
  .widget{padding:0}
  .back-row,.actions{display:none}
  main{max-width:none;margin:0;border:0;box-shadow:none;background:#fff;color:#000}
  header{border-bottom-color:#000}
  h1,label,#emailPreview{color:#000}
  input,textarea,#emailPreview{border-color:#777;color:#000;background:#fff}
}
</style>
</head>
<body>
<div class="widget">
  <div class="back-row">
    <a href="index.html" class="back-link">&#8592; Wesco Hub</a>
  </div>
  <main>
    <header>
      <img class="logo" src="Wesco Logo 2.png" alt="Wesco Exteriors, Inc.">
      <div class="title">
        <h1>Wesco, Inc.</h1>
        <p class="subtitle">CUSTOMER CONTRACT REQUEST</p>
      </div>
    </header>

    <p class="notice">Complete all required project and recipient details. Enter N/A when information is not available.</p>

    <form id="contractForm">
      <fieldset>
        <legend>Project Details</legend>
        <div class="form-grid">
          <div class="field">
            <label for="propertyName">Property Name <span class="required">*</span></label>
            <input id="propertyName" name="propertyName" required placeholder="Property name">
          </div>
          <div class="field">
            <label for="estimateNumber">QB Estimate # <span class="required">*</span></label>
            <input id="estimateNumber" name="estimateNumber" required placeholder="#XXXX">
          </div>
          <div class="field">
            <label for="customer">Customer <span class="required">*</span></label>
            <input id="customer" name="customer" required placeholder="Customer or company name">
          </div>
          <div class="field">
            <label for="contractValue">Contract Value <span class="required">*</span></label>
            <input id="contractValue" name="contractValue" required inputmode="decimal" placeholder="$0.00">
          </div>
          <div class="field wide">
            <label for="scope">Scope of Work <span class="required">*</span></label>
            <textarea id="scope" name="scope" required placeholder="Brief description, such as siding replacement or roofing repairs"></textarea>
          </div>
          <div class="field">
            <label for="startTimeline">Est Start Timeline</label>
            <input id="startTimeline" name="startTimeline" placeholder="If known, otherwise N/A">
          </div>
          <div class="field">
            <label for="completeTimeline">Est Complete Timeline</label>
            <input id="completeTimeline" name="completeTimeline" placeholder="If known, otherwise N/A">
          </div>
        </div>
      </fieldset>

      <fieldset style="margin-top:26px">
        <legend>Contract Recipient</legend>
        <div class="form-grid">
          <div class="field">
            <label for="recipient">Recipient <span class="required">*</span></label>
            <input id="recipient" name="recipient" required placeholder="Recipient name">
          </div>
          <div class="field">
            <label for="recipientEmail">Email <span class="required">*</span></label>
            <input id="recipientEmail" name="recipientEmail" type="email" required placeholder="name@example.com">
          </div>
        </div>
      </fieldset>

      <section class="preview-wrap" aria-labelledby="previewHeading">
        <h2 id="previewHeading">EMAIL BODY</h2>
        <div id="emailPreview" aria-live="polite"></div>
      </section>

      <div class="actions">
        <span id="status" role="status" aria-live="polite"></span>
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>
</div>

<script>
    const form = document.getElementById('contractForm');
    const preview = document.getElementById('emailPreview');
    const status = document.getElementById('status');
    const value = (id, fallback) => document.getElementById(id).value.trim() || fallback;

    function buildEmail() {
      const property = value('propertyName', '[PROPERTY NAME]');
      const estimate = value('estimateNumber', '[QB ESTIMATE #]');
      const customer = value('customer', '[CUSTOMER]');
      const contractValue = value('contractValue', '[CONTRACT VALUE]');
      const scope = value('scope', '[BRIEF DESCRIPTION]');
      const start = value('startTimeline', 'N/A');
      const complete = value('completeTimeline', 'N/A');
      const recipient = value('recipient', '[NAME]');
      const email = value('recipientEmail', '[EMAIL ADDRESS]');

      return `Customer Contract Request:\n\nHi Stephanie,\n\nCan you please reach out to request and execute a contract for the following project? I've attached the final estimate to be sent with your request. Below are the details:\n\nProperty Name: ${property}\nQB Estimate #: ${estimate}\nCustomer: ${customer}\nContract Value: ${contractValue}\n\nScope of Work: ${scope}\n\nEst Start Timeline: ${start}\n\nEst Complete Timeline: ${complete}\n\nPlease send the contract request to:\n\nRecipient: ${recipient}\nEmail: ${email}`;
    }

    function refreshPreview() {
      preview.textContent = buildEmail();
      status.textContent = '';
    }

    form.addEventListener('input', refreshPreview);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const text = buildEmail();
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = 'Submitted. Email body copied to clipboard.';
      } catch {
        const range = document.createRange();
        range.selectNodeContents(preview);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        status.textContent = 'Submitted. Email body selected for copying.';
      }
    });

    refreshPreview();
  </script>
<script src="staff-portal-back.js"></script>
</body>
</html>
