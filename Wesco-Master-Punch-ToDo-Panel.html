<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wes Atkinson Everyday To List</title>
  <style>
    :root{
      color-scheme:dark;
      --orange:#f36a00;
      --orange-light:#ff9a4d;
      --panel:rgba(9,14,16,.82);
      --line:rgba(255,255,255,.14);
      --text:#fff;
      --muted:rgba(255,255,255,.68);
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{color:var(--text);font-family:"Open Sans",Arial,Helvetica,sans-serif;background:var(--panel)}
    button{font:inherit}
    .panel{height:100%;display:flex;flex-direction:column;border-top:1px solid rgba(243,106,0,.32)}
    .bar{
      min-height:34px;padding:6px 9px;display:flex;align-items:center;gap:7px;
      border-bottom:1px solid var(--line);background:rgba(4,8,10,.62);
    }
    .title{min-width:0;flex:1;font-size:11px;font-weight:800;letter-spacing:.035em;text-transform:uppercase}
    .count{color:var(--orange-light);font-size:10px;font-weight:800}
    .action{
      min-height:24px;padding:4px 7px;border:1px solid rgba(243,106,0,.62);border-radius:5px;
      color:#fff;background:rgba(243,106,0,.18);font-size:10px;font-weight:800;cursor:pointer;
    }
    .action:hover,.action:focus{background:var(--orange);outline:none}
    .tasks{min-height:0;flex:1;overflow-y:auto;scrollbar-color:var(--orange) rgba(255,255,255,.06)}
    .task{
      display:grid;grid-template-columns:17px minmax(0,1fr) auto;gap:7px;align-items:center;
      min-height:38px;padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.08);
      color:#fff;background:rgba(9,14,16,.28);
    }
    .check{width:14px;height:14px;border:1px solid var(--orange);border-radius:50%}
    .task-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700}
    .meta{color:var(--muted);font-size:9px;white-space:nowrap}
    .important .check{background:var(--orange);box-shadow:inset 0 0 0 3px #11191d}
    .state{
      min-height:0;flex:1;display:flex;align-items:center;justify-content:center;
      padding:14px;text-align:center;color:var(--muted);font-size:11px;line-height:1.45;
    }
    .state.error{color:var(--danger)}
    @media print{body{display:none}}
  </style>
</head>
<body>
  <section class="panel" aria-label="Wes Atkinson Everyday To List">
    <header class="bar">
      <span class="title">Wes Atkinson Everyday To List</span>
      <span class="count" id="taskCount"></span>
      <button class="action" id="refreshBtn" type="button">Refresh</button>
    </header>
    <div class="state" id="state">Loading Wes Atkinson Everyday To List...</div>
    <div class="tasks" id="taskList" hidden></div>
  </section>
  <script>
  (function(){
    'use strict';
    function $(id){return document.getElementById(id)}
    function esc(value){
      return String(value==null?'':value).replace(/[&<>"']/g,function(c){
        return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
      })
    }
    function showState(message,error){
      $('taskList').hidden=true;
      $('state').hidden=false;
      $('taskCount').textContent='';
      $('state').className='state'+(error?' error':'');
      $('state').textContent=message;
    }
    function dueLabel(task){
      if(!task.dueDateTime||!task.dueDateTime.dateTime)return'';
      var date=new Date(task.dueDateTime.dateTime);
      return isNaN(date.getTime())?'':date.toLocaleDateString([], {month:'short',day:'numeric'});
    }
    function render(tasks){
      var open=tasks.filter(function(task){return task.status!=='completed'});
      open.sort(function(a,b){
        if(a.importance!==b.importance)return a.importance==='high'?-1:1;
        var ad=a.dueDateTime&&a.dueDateTime.dateTime||'9999';
        var bd=b.dueDateTime&&b.dueDateTime.dateTime||'9999';
        return ad.localeCompare(bd)||a.title.localeCompare(b.title);
      });
      $('state').hidden=true;
      $('taskList').hidden=false;
      $('taskCount').textContent=open.length+' open';
      $('taskList').innerHTML=open.length?open.map(function(task){
        var important=task.importance==='high';
        var due=dueLabel(task);
        return '<div class="task'+(important?' important':'')+'">'+
          '<span class="check" aria-hidden="true"></span>'+
          '<span class="task-title">'+esc(task.title||'Untitled task')+'</span>'+
          '<span class="meta">'+esc(due||(important?'Important':''))+'</span>'+
        '</div>';
      }).join(''):'<div class="state">No open punch-list tasks.</div>';
    }
    async function loadTasks(){
      showState('Loading Wes Atkinson Everyday To List...',false);
      try{
        var response=await fetch('/api/master-punch-tasks',{headers:{Accept:'application/json'}});
        if(!response.ok)throw new Error('Task mirror returned '+response.status);
        var data=await response.json();
        render(data.tasks||[]);
      }catch(error){
        showState('Wes Atkinson Everyday To List is temporarily unavailable.',true);
      }
    }
    document.addEventListener('DOMContentLoaded',function(){
      $('refreshBtn').addEventListener('click',loadTasks);
      loadTasks();
    });
  })();
  </script>
</body>
</html>
